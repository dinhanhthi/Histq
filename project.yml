name: "Histq"
options:
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Release builds are arm64 only (like CmdTab/OpenDisplay).
    ARCHS: arm64
    # Ad-hoc default; the app target overrides it with Developer ID.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "86H6CNLN4C"
packages:
  HistqCore:
    path: Packages/HistqCore
targets:
  "Histq":
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: HistqCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.math2it.histq"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_CFBundleDisplayName: "Histq"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Debug is Developer ID-signed like Release, so Keychain items and macOS grants survive rebuilds and are shared with the installed app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
